name: Release

# 一个流程完成测试、构建与发布：
#   推送 v* 标签（如 v1.0.0）→ 测试 → 构建单文件二进制（前端已内置）并与官方 Xray-core 打包 → 推送多架构镜像 → 创建 GitHub Release
#     镜像标签：1.0.0、1.0、latest（预发布版本如 v1.1.0-rc1 只打 1.1.0-rc1，不更新 latest，Release 标记为预发布）
#   推送 main 分支 → 测试 → 只推送镜像（标签 main、sha-xxxxxxx），不发布 Release
#   手动运行（Actions 页面 → Release → Run workflow）→ 为已有标签重新发布（覆盖同名附件）
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（如 v1.0.0，需已存在）"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 发布的标签：手动运行时为输入值，推送标签时为标签名，推送 main 时为空
  RELEASE_TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  # 打包进发布包的 Xray-core 版本：latest 为发布时的最新版，也可固定为如 v25.9.11
  XRAY_VERSION: latest

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum

      - name: Go 测试
        run: cd go-backend && go test ./...

      - name: 前端测试
        run: cd frontend && npm ci && npm test

  binaries:
    needs: test
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      xray_version: ${{ steps.xray.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum

      - name: 构建前端并嵌入
        run: make web

      - name: 构建二进制
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm; do
            os=${target%/*}; arch=${target#*/}; name=$arch
            [ "$arch" = arm ] && name=armv7
            (cd go-backend && CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=7 \
              go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" -o ../dist/xray-panel-$os-$name ./cmd/server)
          done
          # 确认前端已嵌入、产物可以运行且版本号正确
          test -f go-backend/internal/webui/dist/index.html
          ./dist/xray-panel-linux-amd64 version | grep -q "${RELEASE_TAG}"

      # 发布包内置官方 Xray-core 与规则数据：安装时只需下载一个文件，不再单独访问 XTLS 仓库
      - name: 下载官方 Xray-core
        id: xray
        run: |
          if [ "$XRAY_VERSION" = latest ]; then base=https://github.com/XTLS/Xray-core/releases/latest/download
          else base=https://github.com/XTLS/Xray-core/releases/download/$XRAY_VERSION; fi
          mkdir -p xray
          for pair in amd64:64 arm64:arm64-v8a armv7:arm32-v7a; do
            name=${pair%%:*}; asset=Xray-linux-${pair#*:}.zip
            curl -fsSL --retry 3 -o "xray/$asset" "$base/$asset"
            curl -fsSL --retry 3 -o "xray/$asset.dgst" "$base/$asset.dgst"
            want=$(awk -F'=' '$1 == "SHA2-256" {gsub(/[ \r]/, "", $2); print $2}' "xray/$asset.dgst")
            echo "$want  xray/$asset" | sha256sum -c -
            mkdir -p "xray/$name"
            unzip -q -o "xray/$asset" xray geoip.dat geosite.dat -d "xray/$name"
          done
          ver=$(./xray/amd64/xray version | head -1 | awk '{print $2}')
          echo "Xray-core $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: 打包
        run: |
          for name in amd64 arm64 armv7; do
            d=pkg/xray-panel-linux-$name
            mkdir -p "$d"
            cp "dist/xray-panel-linux-$name" "$d/xray-panel"
            cp "xray/$name/xray" "xray/$name/geoip.dat" "xray/$name/geosite.dat" "$d/"
            chmod 755 "$d/xray-panel" "$d/xray"
            tar -C pkg -czf "dist/xray-panel-linux-$name.tar.gz" "xray-panel-linux-$name"
          done
          cp install.sh dist/
          (cd dist && sha256sum xray-panel-* > SHA256SUMS)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          retention-days: 7

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像版本号
        id: ver
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest 跟随正式版本；预发布版本（标签含 -）不更新 latest
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE_TAG != '' && !contains(env.RELEASE_TAG, '-') }}
            type=raw,value=main,enable=${{ env.RELEASE_TAG == '' && github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ env.RELEASE_TAG == '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE_TAGS: ${{ needs.image.outputs.tags }}
        run: |
          image=$(echo "$IMAGE_TAGS" | head -n1)
          xray_ver="${{ needs.binaries.outputs.xray_version }}"
          cat > notes.md <<EOF
          ## 安装

          **一键安装 / 升级**（Linux + systemd，不需要 Docker）：

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GH_REPO}/main/install.sh | sudo VERSION=${RELEASE_TAG} bash
          \`\`\`

          **Docker**（amd64 / arm64）：

          \`\`\`bash
          docker run -d --name xray-panel --network host --restart always \\
            -v /opt/xray-panel:/data/xray ${image}
          \`\`\`

          附件说明：

          - \`xray-panel-linux-<架构>.tar.gz\`：面板 + 官方 Xray-core ${xray_ver} + 规则数据（一键安装脚本使用）
          - \`xray-panel-linux-<架构>\`：仅面板单文件（前端已内置），适合已有 Xray 的环境；缺少 Xray 时会自动从 GitHub 下载
          - \`SHA256SUMS\`：校验值

          EOF
          pre=""
          case "$RELEASE_TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --notes-file notes.md --generate-notes $pre
          fi
